<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>restoreyt</title>
  <link rel="stylesheet" href="../../build/popup.css">
</head>
<body>
  <header class="head">
    <div class="head-row">
      <h1 class="wordmark">restoreyt</h1>
      <span class="switch">
        <input type="checkbox" id="enabled" role="switch" aria-label="Restore originals on YouTube">
        <span aria-hidden="true"></span>
      </span>
    </div>
    <p class="status" id="status">Checking this tab…</p>
    <div class="actions" id="actions" hidden></div>
  </header>

  <main>
    <section class="report" id="report" aria-labelledby="report-heading" hidden>
      <h2 class="sr-only" id="report-heading">Changes on this page</h2>
      <p class="summary" id="summary" aria-live="polite"></p>
      <ol class="log" id="log"></ol>
      <button type="button" class="text-button more" id="more" hidden></button>
    </section>

    <section class="features" aria-labelledby="features-heading">
      <h2 class="sr-only" id="features-heading">What to restore</h2>
      <ul class="toggles" id="toggles"></ul>
    </section>
  </main>

  <footer class="foot">
    <button type="button" class="text-button" id="open-options">Settings and statistics</button>
    <span class="version" id="version"></span>
  </footer>

  <script src="../../build/popup.js"></script>
</body>
</html>
